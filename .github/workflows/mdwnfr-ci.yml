name: MdwNfr CI and pinned Hieroglyphic Keyboard verification
# Release: verified dividers follow shared text columns below artwork.
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'web/**'
      - 'qa/**'
      - 'tools/**'
      - 'keyboard-lock.json'
      - '.github/workflows/mdwnfr-ci.yml'
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      deploy_now:
        description: 'Deploy the tested main branch to the public Cloudflare Workers PWA'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: mdwnfr-keyboards-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: true}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v5
        with: {node-version: '24'}
      - name: Verify pinned Hieroglyphic Keyboard dependency
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python tools/sync_keyboards.py --verify
      - name: Install matching licensed Egyptian glyph font
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'fonttools[woff]==4.67.0' 'brotli==1.2.1' 'Pillow==13.0.0'
          mkdir -p web/assets/fonts
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansegyptianhieroglyphs/NotoSansEgyptianHieroglyphs-Regular.ttf' -o /tmp/mdwnfr-font.ttf
          echo 'b792accc6207ca9caa59fc67f53926b6985a99d255dd432d7c68b68a6dfd62f8  /tmp/mdwnfr-font.ttf' | sha256sum -c -
          python tools/generate_glyph_ink.py /tmp/mdwnfr-font.ttf core/mdwnfr/data/glyph_geometry.json
          python - <<'PY'
          from fontTools.ttLib import TTFont
          f=TTFont('/tmp/mdwnfr-font.ttf')
          f.flavor='woff2'
          f.save('web/assets/fonts/hieroglyphs.woff2')
          PY
      - name: Verify source authority, layout and editor regression
        run: |
          set -euo pipefail
          python tools/sync_keyboards.py --verify
          PYTHONPATH=core python -m unittest discover -s qa -p 'test_*.py' -v
          node --check web/app.js
          node --check web/worker.js
          node --check web/keyboard-prediction-worker.mjs
          node --check web/vendor/hieroglyphic/keyboard_api.mjs
          python -m compileall -q core/mdwnfr
          node qa/test_quadrat_preview.mjs
          node qa/test_hieroglyph_facing.mjs
          node tools/test_layout_detail_guard.mjs
          node tools/test_recovery_storage.mjs
      - name: Verify reproducible offline browser assets
        run: |
          set -euo pipefail
          python tools/vendor_runtime.py
          python tools/build_static.py
          node qa/test_service_worker_cache.mjs
          node qa/test_pages_overview.mjs
      - name: Install Wrangler only after explicit production cutover
        if: github.event_name != 'pull_request' && (vars.CUTOVER_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_now) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-cloudflare]')))
        run: npm install --global wrangler@4.45.4
      - name: Deploy verified MdwNfr worker ONLY after explicit cutover
        if: github.event_name != 'pull_request' && (vars.CUTOVER_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_now) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-cloudflare]')))
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          wrangler deploy --config wrangler.toml
          curl --fail --silent --show-error --retry 5 https://mdwnfr.sydgouda.workers.dev/ > /tmp/mdwnfr-production-check.html
          test -s /tmp/mdwnfr-production-check.html
          curl --fail --silent --show-error --retry 5 https://mdwnfr.sydgouda.workers.dev/runtime-status.json > /tmp/mdwnfr-runtime.json
          curl --fail --silent --show-error --retry 5 https://mdwnfr.sydgouda.workers.dev/offline-assets.json > /tmp/mdwnfr-offline.json
          python - <<'PY'
          import json
          from pathlib import Path
          runtime=json.loads(Path('/tmp/mdwnfr-runtime.json').read_text())
          publication=json.loads(Path('/tmp/mdwnfr-offline.json').read_text())
          assert runtime.get('offline_ready') is True, 'Deployed Python runtime incomplete'
          assert publication.get('complete') is True, 'Deployed offline asset publication incomplete'
          paths={item['path'] for item in publication['assets']}
          assert {'/worker.js','/app.js','/keyboard-prediction-worker.mjs',
                  '/vendor/pyodide/pyodide.asm.wasm','/lexicon/lexicon.json'} <= paths
          print('Production runtime and offline asset inventory verified')
          PY
