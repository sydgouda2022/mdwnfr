# Live verification after table-cell touch release cb31a846.
# Production verification following ink-bounded divider release 26b82a9d.
name: MdwNfr Live User Journey Audit (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mdwnfr-live-audit.yml'
      - 'qa/audit_live_ui_20261030.mjs'
      - 'qa/audit_live_ui_20261030.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        name: [small-phone, phone, tablet, desktop]
    env:
      AUDIT_VARIANT: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install free Chromium and WebKit test browsers
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Audit actual deployed Cloudflare PWA at four screen sizes
        run: node qa/audit_live_ui_20261030.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-journey-audit-screenshots-${{ matrix.name }}
          path: /tmp/mdwnfr-audit-*.png
          if-no-files-found: ignore
