name: Bootstrap MdwNfr from aaa with independent Hieroglyphic Keyboard
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'sydgouda2022/mdwnfr'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: true}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v5
        with: {node-version: '24'}
      - name: Import original editor and pinned hieroglyphic dependency
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/sydgouda2022/aaa.git /tmp/aaa-original
          cp -a /tmp/aaa-original/mdwnfr/. ./
          mkdir -p web/lexicon
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          name='hieroglyphic-keyboard'
          lock={'format':'keyboard-dependencies-v1','migration_origin':'sydgouda2022/aaa',
            'dependencies':{name:{'upstream_repository':'sydgouda2022/'+name,
                                  'source_commit':None,'version':None,
                                  'manifest_sha256':None,'lexicon_sha256':None}}}
          Path('keyboard-lock.json').write_text(json.dumps(lock,indent=2)+'\n')
          Path('SOURCE_PROVENANCE.json').write_text(json.dumps({
            'origin':'sydgouda2022/aaa',
            'commit':subprocess.check_output(['git','-C','/tmp/aaa-original','rev-parse','HEAD'],text=True).strip(),
            'source_subfolder':'mdwnfr/'
          },indent=2)+'\n')
          PY
          python tools/sync_keyboards.py
          cat > README.md <<'EOF'
          # MdwNfr — Hieroglyphic Writing Editor

          Independently owned Python document model, hieroglyphic text
          compositor, page geometry, iPad/iPhone editor and offline PWA,
          migrated from `sydgouda2022/aaa/mdwnfr`.

          Native hieroglyphic predictive input and its lexicon are imported
          exclusively from `sydgouda2022/hieroglyphic-keyboard`, with exact
          source commit and SHA-256 checksum in `keyboard-lock.json`.
          Neither MdwNfr nor Renpet edits the keyboard's source database.
          Production Cloudflare deployment remains with the original
          repository until an explicit migration cutover.
          EOF
          cat > CUTOVER.md <<'EOF'
          # Protect the live application while migrating

          The original aaa repository continues deploying the live MdwNfr.
          This bootstrap only imports source and tests it; it does not deploy.
          Before cutover, configure new-repository Cloudflare secrets, verify
          WebKit and offline PWA acceptance, disable original deployment and
          perform a controlled one-owner deploy to the SAME existing URL.
          EOF
      - name: Generate font-exact glyph geometry and verify layout
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'fonttools[woff]' brotli Pillow
          mkdir -p web/assets/fonts
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansegyptianhieroglyphs/NotoSansEgyptianHieroglyphs-Regular.ttf' -o /tmp/mdwnfr-font.ttf
          echo 'b792accc6207ca9caa59fc67f53926b6985a99d255dd432d7c68b68a6dfd62f8  /tmp/mdwnfr-font.ttf' | sha256sum -c -
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansegyptianhieroglyphs/OFL.txt' -o web/assets/fonts/OFL-NotoEgyptian.txt
          python - <<'PY'
          from fontTools.ttLib import TTFont
          f=TTFont('/tmp/mdwnfr-font.ttf');f.flavor='woff2'
          f.save('web/assets/fonts/hieroglyphs.woff2')
          PY
          python tools/generate_glyph_ink.py /tmp/mdwnfr-font.ttf core/mdwnfr/data/glyph_geometry.json
          python tools/sync_keyboards.py --verify
          PYTHONPATH=core python -m unittest discover -s qa -p 'test_*.py' -v
          node --check web/app.js
          node --check web/worker.js
          node --check web/lexicon-install.mjs
      - name: Verify standalone offline browser release
        run: |
          set -euo pipefail
          python tools/vendor_runtime.py
          python tools/build_static.py
          node qa/test_service_worker_cache.mjs
          node qa/test_quadrat_preview.mjs
          node qa/test_pages_overview.mjs
      - name: Commit tested independent editor sources
        run: |
          set -euo pipefail
          cat > .gitignore <<'EOF'
          dist/
          __pycache__/
          *.pyc
          web/vendor/pyodide/
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CUTOVER.md SOURCE_PROVENANCE.json keyboard-lock.json .gitignore core data qa tools web worker.mjs wrangler.toml pyproject.toml
          git diff --cached --quiet && exit 0
          git commit -m 'Import MdwNfr with independently sourced hieroglyphic keyboard and tested layout'
          git push origin HEAD:main
